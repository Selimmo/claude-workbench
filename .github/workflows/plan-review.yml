name: plan-review

on:
  pull_request:
    paths: ["plugins/plan-review/**", ".github/workflows/plan-review.yml"]
  push:
    branches: [main]
    paths: ["plugins/plan-review/**", ".github/workflows/plan-review.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/plan-review
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: plugins/plan-review/web/.nvmrc
          cache: npm
          cache-dependency-path: plugins/plan-review/web/package-lock.json
      - run: npm ci --prefix web
      - run: uv sync --locked
      - run: ./check.sh
