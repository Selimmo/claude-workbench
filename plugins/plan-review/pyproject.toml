[project]
name = "plan-review"
version = "0.1.3"
description = "A visual, commentable plan viewer for Claude Code agent pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "pydantic>=2.12",
    "uvicorn>=0.38",
    "websockets>=15",
]

[project.scripts]
plan-review = "plan_review.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "pyright>=1.1.408",
    "httpx2>=2.16.0",
    "pytest-timeout>=2.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
timeout = 10  # a WebSocket test waiting for an event that never comes fails instead of hanging

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
venvPath = "."
venv = ".venv"
