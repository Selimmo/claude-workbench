# mutmut's settings (mutation testing; not shipped). Run: uv run --with mutmut mutmut run
[mutmut]
paths_to_mutate = src/plan_review/
tests_dir = tests/
also_copy =
    src/plan_review/
    tests/
    workflow/
    agents/
    skills/
    examples/
    scripts/
    bin/
    web/
    .claude-plugin/
    README.md
    check.sh
    release.sh
# Tests left out: they need a git repo, start a fresh plan-review in its own environment,
# or read the source files and package folder, which mutmut rewrites in its sandbox.
pytest_add_cli_args =
    --deselect=tests/harness/test_agent_rules.py::test_claude_code_takes_only_model_families_and_its_effort_names
    --deselect=tests/harness/test_generate.py::test_generate_package_root_is_the_plugin_folder
    --deselect=tests/harness/test_upgrade.py::test_upgrade_package_root_is_the_plugin_folder
    --deselect=tests/test_package_layout.py
    --deselect=tests/test_package.py
    --deselect=tests/test_bin.py
    --deselect=tests/test_core_is_neutral.py::test_the_page_names_no_cli
